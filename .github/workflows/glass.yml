name: build glass launcher
on:
  push:
    branches: [main]
    paths: ["launcher/**", ".github/workflows/glass.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-25" "build-tools;34.0.0" >/dev/null
      - name: build
        env:
          DUMBTV_KEYSTORE: ${{ github.workspace }}/launcher/glass.keystore
          DUMBTV_KEYPASS: glasshome
        run: ./launcher/build.sh
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd launcher/build
          sha256sum dumbtv-home.apk > dumbtv-home.apk.sha256
          gh release create "glass-${{ github.run_number }}" dumbtv-home.apk dumbtv-home.apk.sha256 \
            --title "Glass build ${{ github.run_number }}" --notes "Built from ${{ github.sha }}" --latest
